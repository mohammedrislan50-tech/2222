                        renderCurrentRoute();
                    }

                console.warn('BroadcastChannel not supported or blocked:', e);

            if (obsTournamentId) {

        function selectPackForWizard(packId) {
            document.querySelectorAll('.pack-card').forEach(el => {

            });
            document.querySelectorAll('[id^="check-"]').forEach(el => el.classList.add('hidden'));

            const selected = document.getElementById(`pack-card-${packId}`);
            if (selected) {
                selected.classList.remove('border-slate-800');
                selected.classList.add('border-brand-500', 'bg-brand-500/10');
            }
            const check = document.getElementById(`check-${packId}`);
            if (check) check.classList.remove('hidden');

        function recordBall(runs) {
            const match = getActiveMatch();
            if (!match) return;

            // Push State Backup to Undo History Stack
            match.historyStack.push(JSON.parse(JSON.stringify(match)));

            let runVal = 0;
            let isLegal = true;

            if (typeof runs === 'number') {
                runVal = runs;
                match.strikerStats.runs += runs;
                match.strikerStats.balls += 1;
                if (runs === 4) match.strikerStats.fours += 1;
                if (runs === 6) match.strikerStats.sixes += 1;
                
                // Trigger auto overlays
                if (runs === 4) triggerBroadcastGraphic('four');
                if (runs === 6) triggerBroadcastGraphic('six');
            } else if (runs === 'WD' || runs === 'NB') {
                runVal = 1;
                isLegal = false;
            }

            match.teamAScore += runVal;
            match.bowlerStats.runs += runVal;
            match.currentOverBalls.push(runs);

            if (isLegal) {
                // Increment Over balls counter
                let currOvers = match.teamAOvers;
                let full = Math.floor(currOvers);
                let ballNum = Math.round((currOvers - full) * 10);
                ballNum += 1;

                if (ballNum >= 6) {
                    match.teamAOvers = full + 1;
                    match.bowlerStats.overs = Math.floor(match.bowlerStats.overs) + 1;
                    match.currentOverBalls = [];
                    // Auto Swap Strike on over end
                    const temp = match.strikerId;
                    match.strikerId = match.nonStrikerId;
                    match.nonStrikerId = temp;
                    showToast('End of Over! Strikes Swapped.', 'info');
                } else {
                    match.teamAOvers = parseFloat((full + ballNum * 0.1).toFixed(1));
                    match.bowlerStats.overs = parseFloat((Math.floor(match.bowlerStats.overs) + ballNum * 0.1).toFixed(1));
                    
                    // Odd run strike rotation
                    if (runVal % 2 !== 0) {
                        const temp = match.strikerId;
                        match.strikerId = match.nonStrikerId;
                        match.nonStrikerId = temp;
                    }
                }
            }

            saveStore();
            renderCurrentRoute();
        }

        function openWicketModal() {
            const match = getActiveMatch();
            const striker = state.players.find(p => p.id === match.strikerId) || { fullName: 'Striker' };

        function handleWicketDismissal(e) {
            e.preventDefault();
            const match = getActiveMatch();
            const nextBatterId = document.getElementById('wk-next').value;

            match.historyStack.push(JSON.parse(JSON.stringify(match)));

            match.teamAWickets += 1;
            match.bowlerStats.wickets += 1;
            match.currentOverBalls.push('W');

            // Reset Striker to Next Batter
            match.strikerId = nextBatterId;
            match.strikerStats = { runs: 0, balls: 0, fours: 0, sixes: 0 };

            saveStore();
            closeModal();
            triggerBroadcastGraphic('wicket');
            showToast('Wicket recorded & graphics triggered!', 'error');
            renderCurrentRoute();
        }

        function undoLastBall() {
            const match = getActiveMatch();
            if (!match || match.historyStack.length === 0) {
                showToast('No actions available to undo', 'info');
                return;
            }

            const previousState = match.historyStack.pop();
            Object.assign(match, previousState);
            saveStore();
            showToast('Previous ball restored', 'success');
            renderCurrentRoute();
        }

        function swapStrike() {
            const match = getActiveMatch();
            if (!match) return;
            const temp = match.strikerId;
            match.strikerId = match.nonStrikerId;
            match.nonStrikerId = temp;
            saveStore();
            renderCurrentRoute();
        }

        function renderSceneLayersToCanvas(scene) {
            if (!scene || !scene.layers) return '';

            const tourney = getActiveTournament();
            const match = getActiveMatch();

            // Mock Data Binding Resolver
            const resolveField = (text) => {
                if (!text) return '';
                return text
                    .replace('{{TOURNAMENT_NAME}}', tourney ? tourney.name : 'SRI LANKA TOURNAMENT')
                    .replace('{{VENUE}}', tourney ? tourney.venue : 'COLOMBO')
                    .replace('{{TEAM_A_NAME}}', 'COLOMBO KINGS')
                    .replace('{{TEAM_A_SCORE}}', match ? match.teamAScore : '142')
                    .replace('{{TEAM_A_WICKETS}}', match ? match.teamAWickets : '4')
                    .replace('{{TEAM_A_OVERS}}', match ? match.teamAOvers : '5.2')
                    .replace('{{TEAM_B_NAME}}', 'KANDY WARRIORS')
                    .replace('{{STRIKER_NAME}}', 'D. CHANDIMAL')
                    .replace('{{STRIKER_RUNS}}', '38')
                    .replace('{{STRIKER_BALLS}}', '18')
                    .replace('{{NON_STRIKER_NAME}}', 'K. PERERA')
                    .replace('{{NON_STRIKER_RUNS}}', '22')
                    .replace('{{NON_STRIKER_BALLS}}', '12')
                    .replace('{{BOWLER_NAME}}', 'W. HASARANGA')
                    .replace('{{BOWLER_WICKETS}}', '2')
                    .replace('{{BOWLER_RUNS}}', '18')
                    .replace('{{BOWLER_OVERS}}', '1.4');
            };

            return scene.layers.map(layer => {
                // Scale factor for 960x540 viewport (1920x1080 -> 0.5)
                const sx = (layer.x || 0) * 0.5;
                const sy = (layer.y || 0) * 0.5;

                if (layer.type === 'bg') {
                    return `<div class="absolute inset-0 pointer-events-none" style="background-color: ${layer.color}; opacity: ${layer.opacity};"></div>`;
                }
                if (layer.type === 'shape') {
                    const sw = (layer.w || 100) * 0.5;
                    const sh = (layer.h || 50) * 0.5;
                    return `<div class="absolute border border-slate-600/30" style="left: ${sx}px; top: ${sy}px; width: ${sw}px; height: ${sh}px; background-color: ${layer.color}; border-radius: ${layer.radius || 0}px;"></div>`;
                }
                if (layer.type === 'text') {
                    const sf = (layer.fontSize || 24) * 0.5;
                    const resolved = resolveField(layer.text);
                    return `
                        <div onclick="selectStudioLayer('${layer.id}')" class="absolute cursor-pointer hover:outline hover:outline-brand-500 hover:outline-2 px-1 rounded" style="left: ${sx}px; top: ${sy}px; font-size: ${sf}px; color: ${layer.color}; font-weight: ${layer.fontWeight || 'normal'}; font-family: Outfit, sans-serif;">
                            ${resolved}
                        </div>
                    `;
                }
                return '';
            }).join('');
        }
